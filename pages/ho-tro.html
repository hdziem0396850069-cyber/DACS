<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Hỗ trợ | HUTECH Intern</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span class="logo-text">HUTECH <strong>Intern</strong></span>
      </a>
      <nav class="nav-main">
        <a href="viec-lam.html" class="nav-item">Việc làm</a>
        <a href="ho-so.html" class="nav-item">Hồ sơ</a>
        <a href="ung-tuyen.html" class="nav-item">Ứng tuyển</a>
        <a href="cong-ty.html" class="nav-item">Công ty</a>
      </nav>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Hỗ trợ</h1>
      <p>Liên hệ và được hỗ trợ nhanh nhất</p>
    </div>
  </div>

  <div class="container" style="padding:24px 16px; max-width: 860px;">
    <div class="support-grid">
      <div class="support-card">
        <i class="fas fa-phone"></i>
        <h3>Hotline</h3>
        <p>1900 000 000</p>
      </div>
      <div class="support-card">
        <i class="fas fa-envelope"></i>
        <h3>Email</h3>
        <p>hotro@hutechintern.vn</p>
      </div>
      <div class="support-card">
        <i class="fas fa-comment-dots"></i>
        <h3>Chat</h3>
        <p>Trả lời trong vòng 5 phút</p>
      </div>
    </div>
  </div>

  <style>
    .support-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 18px;
    }
    .support-card {
      background: white; border: 1px solid var(--border); border-radius: 18px;
      padding: 24px; text-align: center; box-shadow: var(--shadow);
    }
    .support-card i { font-size: 26px; color: var(--primary); margin-bottom: 12px; }
    .support-card h3 { margin-bottom: 8px; }
  </style>
</body>
</html>
