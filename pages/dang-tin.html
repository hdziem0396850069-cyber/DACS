<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Đăng tin tuyển dụng | HUTECH Intern</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span class="logo-text">HUTECH <strong>Intern</strong></span>
      </a>
      <nav class="nav-main">
        <a href="viec-lam.html" class="nav-item">Việc làm</a>
        <a href="ho-so.html" class="nav-item">Hồ sơ</a>
        <a href="ung-tuyen.html" class="nav-item">Ứng tuyển</a>
        <a href="cong-ty.html" class="nav-item">Công ty</a>
      </nav>
      <div class="header-right">
        <div class="user-menu">
          <img src="https://ui-avatars.com/api/?name=Employer&background=00b14f&color=fff" class="avatar" alt="">
        </div>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container">
      <h1>Đăng tin tuyển dụng</h1>
      <p>Đăng bài tuyển dụng dành cho nhà tuyển dụng</p>
    </div>
  </div>

  <div class="container" style="padding:24px 16px; max-width: 820px;">
    <form class="form-card">
      <div class="form-group">
        <label>Tiêu đề công việc</label>
        <input class="form-control" type="text" value="Thực tập sinh Frontend ReactJS">
      </div>
      <div class="form-group">
        <label>Địa điểm</label>
        <input class="form-control" type="text" value="TP. Hồ Chí Minh">
      </div>
      <div class="form-group">
        <label>Ngành nghề</label>
        <input class="form-control" type="text" value="Lập trình Web">
      </div>
      <div class="form-group">
        <label>Mô tả công việc</label>
        <textarea class="form-control">- Tham gia phát triển UI/UX bằng ReactJS\n- Làm việc với team backend và QA\n- Học hỏi quy trình Agile, review code</textarea>
      </div>
      <button type="button" class="btn btn-primary" style="width:100%; justify-content:center;">Đăng tin ngay</button>
    </form>
  </div>

  <style>
    .form-card {
      background: white; border: 1px solid var(--border); border-radius: 18px;
      padding: 24px; box-shadow: var(--shadow);
    }
  </style>
</body>
</html>
