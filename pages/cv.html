<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quản lý CV | HUTECH Intern</title>
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
  <header class="header">
    <div class="container header-inner">
      <a href="../index.html" class="logo">
        <span class="logo-icon"><i class="fas fa-graduation-cap"></i></span>
        <span class="logo-text">HUTECH <strong>Intern</strong></span>
      </a>
      <nav class="nav-main">
        <a href="viec-lam.html" class="nav-item">Việc làm</a>
        <a href="ho-so.html" class="nav-item">Hồ sơ</a>
        <a href="ung-tuyen.html" class="nav-item">Ứng tuyển</a>
      </nav>
      <div class="header-right">
        <div class="user-menu">
          <img src="https://ui-avatars.com/api/?name=SV&background=00b14f&color=fff" class="avatar" alt="">
        </div>
      </div>
    </div>
  </header>

  <div class="page-header">
    <div class="container" style="display:flex;justify-content:space-between;align-items:center;">
      <div>
        <h1>Quản lý CV</h1>
        <p>Bảng CV_SinhVien – tải lên hoặc tạo CV online</p>
      </div>
      <button class="btn btn-primary"><i class="fas fa-upload"></i> Tải CV lên</button>
    </div>
  </div>

  <div class="container" style="padding:24px 16px;">
    <div class="cv-grid">
      <div class="cv-card default">
        <div class="cv-icon"><i class="fas fa-file-pdf"></i></div>
        <h3>CV Frontend Developer</h3>
        <p class="cv-meta">PDF · 245 KB · Tải lên 05/10/2026</p>
        <span class="badge-default">Mặc định</span>
        <div class="cv-actions">
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;"><i class="fas fa-eye"></i> Xem</button>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;"><i class="fas fa-download"></i></button>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;color:var(--danger);"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <div class="cv-card">
        <div class="cv-icon online"><i class="fas fa-globe"></i></div>
        <h3>CV Online - Fullstack</h3>
        <p class="cv-meta">ONLINE · Tạo 01/09/2026</p>
        <div class="cv-actions">
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;"><i class="fas fa-eye"></i> Xem</button>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;"><i class="fas fa-star"></i> Đặt mặc định</button>
          <button class="btn btn-outline" style="padding:6px 12px;font-size:13px;color:var(--danger);"><i class="fas fa-trash"></i></button>
        </div>
      </div>
      <div class="cv-card add-new" onclick="alert('Mở form tải CV')">
        <i class="fas fa-plus-circle"></i>
        <p>Thêm CV mới</p>
      </div>
    </div>
  </div>

  <style>
    .cv-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 16px; }
    .cv-card {
      background: white; border: 1px solid var(--border); border-radius: var(--radius);
      padding: 20px; text-align: center; position: relative; transition: .2s;
    }
    .cv-card:hover { box-shadow: var(--shadow); }
    .cv-card.default { border-color: var(--primary); }
    .cv-icon {
      width: 56px; height: 56px; margin: 0 auto 12px;
      background: #fef2f2; color: #ef4444; border-radius: 12px;
      display: flex; align-items: center; justify-content: center; font-size: 24px;
    }
    .cv-icon.online { background: var(--primary-light); color: var(--primary); }
    .cv-card h3 { font-size: 15px; margin-bottom: 4px; }
    .cv-meta { font-size: 12px; color: var(--text-muted); margin-bottom: 12px; }
    .badge-default {
      position: absolute; top: 12px; right: 12px;
      background: var(--primary); color: white;
      font-size: 11px; padding: 2px 8px; border-radius: 4px; font-weight: 600;
    }
    .cv-actions { display: flex; gap: 6px; justify-content: center; }
    .cv-card.add-new {
      border-style: dashed; cursor: pointer; color: var(--text-muted);
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      min-height: 180px;
    }
    .cv-card.add-new:hover { border-color: var(--primary); color: var(--primary); }
    .cv-card.add-new i { font-size: 32px; margin-bottom: 8px; }
  </style>
</body>
</html>
